name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore web_app_Csharp.sln

      - name: Build
        run: dotnet build web_app_Csharp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test web_app_Csharp.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Audit dependencies
        run: dotnet package list --project web_app_Csharp/web_app_Csharp.csproj --vulnerable --include-transitive

      - name: Build container image
        run: docker build --file web_app_Csharp/Dockerfile --tag banking-api:ci .
